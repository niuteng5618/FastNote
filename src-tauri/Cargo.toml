[package]
name = "flymd"
version = "1.0.0"
description = "FastNote 轻量笔记"
authors = ["flymd"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
percent-encoding = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
aws-config = { version = "1", features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["rt-tokio"] }
trash = "3"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Linux 原生圆角兜底：直接给 GTK 窗口设置圆角形状区域（shape region），
# 不依赖窗口透明合成，Wayland/XWayland/VM 下也能显示圆角。
# 版本与 tauri 2 已锁定的传递依赖一致（见 Cargo.lock），不会引入新的解析。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
cairo-rs = "0.18"

[profile.release]
# 说明：release 配置优先减小体积和启动时间，后续不要随意改动以免引入性能回退
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
strip = true

[profile.dev]
# 说明：Windows 下 aws-sdk-s3 等大依赖的 debug 符号会显著抬高 rustc 内存峰值。
# Tauri 日常开发不依赖 Rust 调试符号，关掉它能避免 dev 编译阶段内存分配失败。
debug = 0
incremental = true
